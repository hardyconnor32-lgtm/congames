<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Congames.com - Arcade</title>
<link rel="stylesheet" href="styles.css"></head><body>
<header><div><div class="brand"><b>Congames</b>.com</div><div class="tagline">Little games. Big fun.</div></div><strong>Pick a game and play!</strong></header>
<main><section class="intro"><h1>Welcome to the arcade</h1><p>Choose a game below. Your next favorite is one click away.</p></section>
<nav class="games" aria-label="Choose a game">
<button class="game active" data-g="guess"><span class="art" style="background:#eeeaff"><svg viewBox="0 0 150 86"><circle cx="75" cy="43" r="30" fill="#8975f5"/><text x="75" y="56" text-anchor="middle" fill="white" font-size="38" font-weight="bold">?</text><circle cx="28" cy="20" r="7" fill="#ff7298"/><circle cx="122" cy="66" r="9" fill="#ffc857"/></svg></span><strong>Number Guess</strong><small>Find the secret number</small></button>
<button class="game" data-g="word"><span class="art" style="background:#eef8eb"><svg viewBox="0 0 150 86"><g font-weight="bold" text-anchor="middle" fill="white"><rect x="22" y="14" width="31" height="28" rx="4" fill="#55aa7b"/><text x="37" y="34">W</text><rect x="59" y="14" width="31" height="28" rx="4" fill="#d6ad3e"/><text x="74" y="34">O</text><rect x="96" y="14" width="31" height="28" rx="4" fill="#8992a4"/><text x="111" y="34">R</text><rect x="41" y="49" width="31" height="28" rx="4" fill="#55aa7b"/><text x="56" y="69">D</text><rect x="78" y="49" width="31" height="28" rx="4" fill="#d6ad3e"/><text x="93" y="69">S</text></g></svg></span><strong>Word Guess</strong><small>Guess a 5-letter word</small></button>
<button class="game" data-g="mole"><span class="art" style="background:#fff4df"><svg viewBox="0 0 150 86"><ellipse cx="75" cy="67" rx="44" ry="12" fill="#a9825b"/><circle cx="75" cy="46" r="22" fill="#ad7a5c"/><circle cx="56" cy="30" r="11" fill="#d89d83"/><circle cx="94" cy="30" r="11" fill="#d89d83"/><circle cx="67" cy="44" r="3"/><circle cx="83" cy="44" r="3"/><ellipse cx="75" cy="54" rx="6" ry="4" fill="#f8c7b2"/></svg></span><strong>Whack-a-Mole</strong><small>Catch them in 20 seconds</small></button>
<button class="game" data-g="rps"><span class="art" style="background:#fff0e9"><svg viewBox="0 0 150 86"><circle cx="48" cy="43" r="27" fill="#ff9b70"/><circle cx="102" cy="43" r="27" fill="#ffd15e"/><text x="48" y="55" text-anchor="middle" font-size="29">R</text><text x="102" y="55" text-anchor="middle" font-size="29">P</text></svg></span><strong>Rock Paper Scissors</strong><small>Beat the computer</small></button>
<button class="game" data-g="math"><span class="art" style="background:#e9f8f4"><svg viewBox="0 0 150 86"><rect x="48" y="8" width="54" height="70" rx="12" fill="#43c6a4"/><rect x="57" y="17" width="36" height="15" rx="4" fill="white"/><g fill="white"><circle cx="62" cy="45" r="4"/><circle cx="75" cy="45" r="4"/><circle cx="88" cy="45" r="4"/><circle cx="62" cy="61" r="4"/><circle cx="75" cy="61" r="4"/><circle cx="88" cy="61" r="4"/></g></svg></span><strong>Math Sprint</strong><small>Solve a quick question</small></button>
<button class="game" data-g="reaction"><span class="art" style="background:#edf2ff"><svg viewBox="0 0 150 86"><rect x="57" y="5" width="36" height="76" rx="17" fill="#293554"/><circle cx="75" cy="23" r="9" fill="#ff7186"/><circle cx="75" cy="43" r="9" fill="#ffd05e"/><circle cx="75" cy="63" r="9" fill="#45c995"/></svg></span><strong>Reaction Test</strong><small>Click when it turns green</small></button>
<button class="game" data-g="memory"><span class="art" style="background:#fff0f5"><svg viewBox="0 0 150 86"><rect x="35" y="16" width="38" height="52" rx="7" fill="#ff7998" transform="rotate(-12 35 16)"/><rect x="77" y="15" width="38" height="52" rx="7" fill="#9a81f8" transform="rotate(10 77 15)"/><circle cx="54" cy="41" r="8" fill="white"/><path d="M92 34l11 12m0-12L92 46" stroke="white" stroke-width="4"/></svg></span><strong>Memory Match</strong><small>Find four matching pairs</small></button>
<button class="game" data-g="solitaire"><span class="art" style="background:#e7f6ed"><svg viewBox="0 0 150 86"><rect x="42" y="12" width="44" height="62" rx="7" fill="white" stroke="#cbd3df" transform="rotate(-9 42 12)"/><rect x="68" y="13" width="44" height="62" rx="7" fill="white" stroke="#cbd3df" transform="rotate(9 68 13)"/><text x="82" y="55" fill="#df4565" font-size="30">&#9829;</text></svg></span><strong>Solitaire</strong><small>Build four suit stacks</small></button>
<button class="game" data-g="blackjack"><span class="art" style="background:#edf0ff"><svg viewBox="0 0 150 86"><rect x="38" y="14" width="43" height="59" rx="7" fill="white" stroke="#ccd3e1" transform="rotate(-9 38 14)"/><rect x="73" y="13" width="43" height="59" rx="7" fill="white" stroke="#ccd3e1" transform="rotate(9 73 13)"/><text x="51" y="46" fill="#df4565" font-size="22">A</text><text x="90" y="54" font-size="25">&#9824;</text></svg></span><strong>Blackjack</strong><small>Get close to 21</small></button>
<button class="game" data-g="war"><span class="art" style="background:#fff0e9"><svg viewBox="0 0 150 86"><rect x="32" y="18" width="43" height="58" rx="7" fill="#5268f5" transform="rotate(-12 32 18)"/><rect x="77" y="13" width="43" height="58" rx="7" fill="white" stroke="#d5dbe5" transform="rotate(10 77 13)"/><text x="91" y="53" fill="#df4565" font-size="25" font-weight="bold">K</text></svg></span><strong>War</strong><small>Flip cards to win the pile</small></button>
<button class="game" data-g="higher"><span class="art" style="background:#f0ebff"><svg viewBox="0 0 150 86"><rect x="40" y="13" width="45" height="62" rx="8" fill="white" stroke="#cbd2e1"/><text x="51" y="42" fill="#df4565" font-size="22">7</text><path d="M92 62l17-25 17 25h-12v15h-10V62z" fill="#5268f5"/></svg></span><strong>Higher or Lower</strong><small>Guess the next card</small></button>
<button class="game" data-g="ttt"><span class="art" style="background:#f2edff"><svg viewBox="0 0 150 86"><path d="M57 15v56M93 15v56M40 34h70M40 53h70" stroke="#9a81f8" stroke-width="6" stroke-linecap="round"/><circle cx="48" cy="24" r="8" fill="#ff7998"/><path d="M100 47l14 14m0-14-14 14" stroke="#5268f5" stroke-width="5" stroke-linecap="round"/></svg></span><strong>Tic-Tac-Toe</strong><small>Challenge the computer</small></button>
<button class="game" data-g="simon"><span class="art" style="background:#edf2ff"><svg viewBox="0 0 150 86"><path d="M75 42L39 13a26 26 0 0 0-1 40z" fill="#ff7186"/><path d="M75 42l36-29a26 26 0 0 1 1 40z" fill="#ffd05e"/><path d="M75 42L39 71a26 26 0 0 1-1-40z" fill="#45c995" transform="translate(0 8)"/><path d="M75 42l36 29a26 26 0 0 0 1-40z" fill="#7085fa" transform="translate(0 8)"/><circle cx="75" cy="46" r="11" fill="white"/></svg></span><strong>Simon Says</strong><small>Repeat the color pattern</small></button>
<button class="game" data-g="connect"><span class="art" style="background:#eaf0ff"><svg viewBox="0 0 150 86"><rect x="34" y="12" width="82" height="62" rx="9" fill="#5268f5"/><g fill="#fff"><circle cx="48" cy="27" r="7"/><circle cx="69" cy="27" r="7"/><circle cx="90" cy="27" r="7"/><circle cx="105" cy="48" r="7"/></g><circle cx="69" cy="48" r="7" fill="#ff7a8e"/><circle cx="90" cy="48" r="7" fill="#ffd05e"/><circle cx="48" cy="61" r="7" fill="#ffd05e"/><circle cx="69" cy="61" r="7" fill="#ff7a8e"/><circle cx="90" cy="61" r="7" fill="#ffd05e"/></svg></span><strong>Connect Four</strong><small>Get four in a row</small></button></nav><section class="play" id="play" aria-live="polite"></section></main><footer>Congames.com - Made for fun</footer>
<script src="script.js" defer></script></body></html>
